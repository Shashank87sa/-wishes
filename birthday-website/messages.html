<html lang="en">

    <div class="container">
        <h2 class="fade-in">Message Wall</h2>
        <form id="message-form" class="fade-in" style="margin-bottom: 2rem;">
            <textarea id="message-input" rows="4" cols="50" placeholder="Write a sweet message..." required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 400px; display: block; margin: 0 auto 10px;"></textarea>
            <button type="submit" class="btn">Post Message</button>
        </form>
        <div class="message-wall" id="message-wall">
            <div class="sticky-note">Happy Birthday!!</div>
        </div>
    </div>
